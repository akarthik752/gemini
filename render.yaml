# Render Blueprint Configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: farmer-buyer-marketplace
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
